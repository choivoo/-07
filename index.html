<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>호그 사이클 로얄</title>
<style>
html,body{margin:0;height:100%;background:#150e26;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:540px;height:960px;font-size:16px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center;color:#fff;background:rgba(20,10,40,.82)}
.ov.hidden{display:none}
.ov h1{margin:0;font-size:3em;line-height:1.1;color:#ffd23a;text-shadow:0 .1em 0 #14101c,0 0 .5em #ff8a00;-webkit-text-stroke:.05em #14101c;paint-order:stroke fill}
.ov h2{margin:0;font-size:3.2em;-webkit-text-stroke:.05em #14101c;paint-order:stroke fill}
.ov p{margin:.2em 0;font-size:1.1em}
.ov small{opacity:.8;font-size:.85em;max-width:80%}
.row{display:flex;gap:.6em}
button{font:inherit;font-weight:900;font-size:1.2em;color:#fff;background:linear-gradient(#5aa8ff,#2a62d8);border:.18em solid #14101c;border-radius:.6em;padding:.45em 1.1em;cursor:pointer;box-shadow:0 .2em 0 #14101c}
button:active{transform:translateY(.12em);box-shadow:0 .08em 0 #14101c}
button.sel{background:linear-gradient(#ffd23a,#f59a23);color:#14101c}
button.big{font-size:1.6em;background:linear-gradient(#ff8a5a,#e83a2a)}
#crowns{font-size:3em;letter-spacing:.1em}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <canvas id="cv"></canvas>
  <div id="menu" class="ov">
   <h1>호그 사이클<br>로얄</h1>
   <p>난이도를 선택하세요</p>
   <div class="row" id="diffRow">
    <button data-d="easy">쉬움</button>
    <button data-d="normal" class="sel">보통</button>
    <button data-d="hard">어려움</button>
   </div>
   <button id="startBtn" class="big">전투 시작!</button>
   <small>카드를 아래에서 끌어다 내 진영(아래쪽 파랑)에 놓으세요.<br>주문은 어디든 놓을 수 있어요. 상대 프린세스타워를 부수면 그쪽 레인 배치 영역이 넓어집니다.</small>
  </div>
  <div id="result" class="ov hidden">
   <h2 id="resTitle">승리!</h2>
   <div id="crowns"></div>
   <p id="resSub"></p>
   <div class="row">
    <button id="againBtn" class="big">다시 시작</button>
    <button id="menuBtn">난이도 선택</button>
   </div>
  </div>
 </div>
</div>

<script>
'use strict';
/* =====================================================================
   CONFIG : 모든 밸런스/스탯은 여기서 수정하세요.
   거리 단위 = 타일, 시간 단위 = 초
   ===================================================================== */
const CONFIG = {
  W: 540, H: 960,            // 논리 해상도 (9:16)
  T: 24, AX: 54, AY: 44,     // 타일 크기, 아레나 좌상단 오프셋
  COLS: 18, ROWS: 32,
  river: { top: 15, bot: 17 },
  bridges: [3.5, 14.5], bridgeW: 2.2,
  matchTime: 180, doubleAt: 60, overtime: 60,
  elixirMax: 10, elixirStart: 5, elixirBase: 2.8,
  deployTime: 1.0, level: 11, slowMul: 0.65,
  tower: {
    princess: { hp: 3052, range: 7.5, dmg: 109, hit: 0.8, r: 1.0 },
    king:     { hp: 4824, range: 7,   dmg: 109, hit: 1.0, r: 1.45 }
  },
  towerPos: {   // [x, y]  (0 = 플레이어, 1 = AI)
    0: { pl: [3.5, 25.5], pr: [14.5, 25.5], k: [9, 29.4] },
    1: { pl: [3.5, 6.5],  pr: [14.5, 6.5],  k: [9, 2.6] }
  },
  diff: {  // react: 위협 감지 후 반응 지연, mistake: 실수 확률, gap: 카드 사이 간격, pushE: 푸시 시작 엘릭서
    easy:   { react: 2.2, mistake: 0.35, gap: 2.4, pushE: 9 },
    normal: { react: 1.1, mistake: 0.12, gap: 1.3, pushE: 8 },
    hard:   { react: 0.35, mistake: 0.03, gap: 0.7, pushE: 7 }
  },
  deck: ['hog', 'musketeer', 'icegolem', 'icespirit', 'skeletons', 'cannon', 'fireball', 'log'],
  /* 카드 정의.  type: unit | building | spell
     sh = 스프라이트 높이(HP바 위치), ds = 스프라이트 100유닛이 차지하는 타일 수, pz/pcy = 초상화 확대/중심 */
  cards: {
    hog: { name: '호그라이더', cost: 4, rarity: 'rare', type: 'unit', hp: 1696, dmg: 318, hit: 1.6, speed: 2.0, range: 0.9,
           r: 0.55, mass: 3, ds: 1.7, sh: 128, bldOnly: true, jump: true, shout: '호~그!', pz: 1.05, pcy: -62 },
    musketeer: { name: '머스킷병', cost: 4, rarity: 'rare', type: 'unit', hp: 721, dmg: 217, hit: 1.0, speed: 1.0, range: 6,
           r: 0.5, mass: 1.5, ds: 1.5, sh: 115, proj: 'bullet', projSpeed: 24, pz: 1.1, pcy: -62 },
    icegolem: { name: '아이스골렘', cost: 2, rarity: 'rare', type: 'unit', hp: 1197, dmg: 70, hit: 2.5, speed: 0.75, range: 0.9,
           r: 0.8, mass: 8, ds: 1.7, sh: 118, bldOnly: true, death: { radius: 3, dmg: 55, slowT: 1.0 }, pz: 1.1, pcy: -62 },
    icespirit: { name: '아이스스피릿', cost: 1, rarity: 'common', type: 'unit', hp: 230, dmg: 140, hit: 1.0, speed: 2.0, range: 0.8,
           r: 0.4, mass: 0.6, ds: 1.5, sh: 78, hop: true, kamikaze: { radius: 2.5, dmg: 140, freeze: 1.1 }, pz: 1.7, pcy: -40 },
    skeletons: { name: '해골', cost: 1, rarity: 'common', type: 'unit', hp: 81, dmg: 81, hit: 1.0, speed: 1.8, range: 0.7,
           r: 0.38, mass: 0.4, ds: 1.3, sh: 80, count: 3, pz: 1.25, pcy: -45 },
    cannon: { name: '대포', cost: 3, rarity: 'common', type: 'building', hp: 824, dmg: 212, hit: 0.9, range: 5.5, r: 0.9,
           life: 30, ds: 2.0, sh: 70, proj: 'ball', projSpeed: 15, pull: true, pz: 1.5, pcy: -36 },
    fireball: { name: '파이어볼', cost: 4, rarity: 'rare', type: 'spell', radius: 2.5, dmg: 688, towerMul: 0.3, kb: 1.8, pz: 1.1, pcy: -45 },
    log: { name: '통나무', cost: 2, rarity: 'legendary', type: 'spell', width: 3.9, length: 10.1, dmg: 240, towerMul: 0.3, kb: 1.8,
           speed: 10, pz: 1.0, pcy: -40 }
  }
};
const TEAM_COL = [
  { main: '#3b8cff', dark: '#1b4fb8', light: '#a6ceff' },
  { main: '#ff4b4b', dark: '#b01f1f', light: '#ffa0a0' }
];
const RARITY_COL = { common: '#9aa0aa', rare: '#f59a23', epic: '#b44bf0' };

/* ---------------- 유틸 ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const sx = x => CONFIG.AX + x * CONFIG.T;
const sy = y => CONFIG.AY + y * CONFIG.T;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- 그리기 헬퍼 (굵은 검은 외곽선 카툰풍) ---------------- */
function L(c, w) { c.lineWidth = w || 4; c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = '#14101c'; }
function ell(c, x, y, rx, ry, f, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, 6.2832); if (f) { c.fillStyle = f; c.fill(); } c.stroke(); }
function rr(c, x, y, w, h, r, f) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  if (f) { c.fillStyle = f; c.fill(); } c.stroke();
}
function poly(c, p, f) { c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); if (f) { c.fillStyle = f; c.fill(); } c.stroke(); }
function ln(c, x1, y1, x2, y2, w, col) {
  c.save(); c.lineCap = 'round'; c.strokeStyle = '#14101c'; c.lineWidth = w + 4; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.restore();
}
function txt(c, s, x, y, size, fill, align, stroke) {
  c.save(); c.font = '900 ' + size + 'px "Arial Black","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  c.textAlign = align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = Math.max(2, size / 4); c.strokeStyle = stroke || '#14101c'; c.strokeText(s, x, y);
  c.fillStyle = fill || '#fff'; c.fillText(s, x, y); c.restore();
}
/* 공격 스윙 곡선: 0..1 진행도 -> 팔 각도 오프셋 (뒤로 젖힘 -> 내려침 -> 복귀) */
function swing(p) { if (p <= 0) return 0; if (p < .35) return 2.0 * p / .35; if (p < .6) return 2.0 - 3.2 * (p - .35) / .25; return -1.2 * (1 - (p - .6) / .4); }

/* =====================================================================
   스프라이트 그리기 함수들
   - 발 중심이 (0,0), 위쪽이 -y, 오른쪽을 보는 방향. 100유닛 ≈ 한 몸 크기
   - o = { t, walk(0~1), atk(0~1 공격진행), col(진영색), dk, active, fx }
   - 새 카드를 추가하려면 drawXxx 를 만들고 SPRITES 에 등록
   ===================================================================== */
function drawHog(c, o) {
  L(c);
  const s = Math.sin(o.t * 15) * o.walk, bob = -Math.abs(Math.cos(o.t * 15)) * 5 * o.walk, sw = swing(o.atk);
  ln(c, -22, -16, -22 - s * 10, 0, 10, '#6e4226'); ln(c, 26, -16, 26 + s * 10, 0, 10, '#6e4226');
  c.save(); c.translate(0, bob);
  c.beginPath(); c.arc(-44, -38, 7, 0.5, 5.5); c.lineWidth = 8; c.strokeStyle = '#14101c'; c.stroke(); c.lineWidth = 4; c.strokeStyle = '#e9a39a'; c.stroke(); L(c);
  ell(c, 0, -34, 41, 26, '#a9693f'); ell(c, 3, -24, 30, 12, '#cf9566');
  ln(c, -12, -18, -12 + s * 10, 0, 11, '#8c5532'); ln(c, 34, -18, 34 - s * 10, 0, 11, '#8c5532');
  ell(c, 45, -37, 19, 17, '#b97848');
  poly(c, [[33, -48], [36, -68], [51, -50]], '#8f5532');
  ell(c, 61, -31, 10, 9, '#f2aaa0'); ell(c, 64, -33, 2, 3, '#14101c'); ell(c, 59, -29, 2, 3, '#14101c');
  poly(c, [[53, -23], [66, -10], [58, -27]], '#fff');
  ell(c, 48, -43, 4.5, 5, '#fff'); ell(c, 49.5, -43, 2.2, 2.8, '#14101c');
  rr(c, -22, -62, 38, 14, 6, o.col);
  ell(c, -4, -64, 14, 10, '#5a3d28');
  ell(c, 0, -84, 16, 21, '#e3a074');
  c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, -98); c.lineTo(0, -80); c.moveTo(-12, -80); c.quadraticCurveTo(0, -72, 12, -80); c.stroke(); L(c);
  rr(c, -14, -73, 28, 8, 3, '#8a5a1a');
  ell(c, 2, -110, 12, 12, '#e3a074');
  poly(c, [[-6, -118], [0, -138], [4, -122], [10, -134], [12, -117]], o.col);
  ell(c, 5, -102, 9, 6, '#5a3a1e');
  ell(c, 7, -111, 2.2, 2.8, '#14101c'); ln(c, 3, -116, 11, -113, 2.5, '#14101c');
  const a = -0.9 - sw * 1.2;
  c.save(); c.translate(8, -90); c.rotate(a);
  ln(c, 0, 0, 14, 0, 9, '#e3a074'); ln(c, 10, 0, 46, 0, 6, '#7a5230');
  rr(c, 38, -13, 22, 26, 5, '#9aa3ad'); rr(c, 38, -13, 6, 26, 3, '#6e7782');
  c.restore();
  c.restore();
}

function drawMusketeer(c, o) {
  L(c);
  const s = Math.sin(o.t * 10) * o.walk, bob = -Math.abs(Math.cos(o.t * 10)) * 3 * o.walk;
  ln(c, -8, -30, -8 + s * 8, -2, 10, '#3a2a22'); ln(c, 9, -30, 9 - s * 8, -2, 10, '#3a2a22');
  ell(c, -8 + s * 8, 0, 9, 4, '#241610'); ell(c, 9 - s * 8, 0, 9, 4, '#241610');
  c.save(); c.translate(0, bob);
  rr(c, -18, -74, 36, 48, 11, o.col);
  rr(c, -4, -74, 8, 44, 2, '#f4f1e6');
  rr(c, -18, -46, 36, 8, 2, '#2b2b34');
  ell(c, 0, -88, 13, 13, '#f0b98d');
  ell(c, -11, -84, 6, 9, '#a23fd0'); ell(c, 13, -84, 6, 9, '#a23fd0');
  c.beginPath(); c.arc(0, -92, 16, Math.PI, 0); c.closePath(); c.fillStyle = '#8d96a3'; c.fill(); c.stroke();
  rr(c, -21, -94, 42, 7, 3, '#6c7480');
  poly(c, [[-4, -106], [-14, -128], [8, -112]], o.col);
  ell(c, 7, -88, 2.4, 3.2, '#14101c');
  const rec = (o.atk > 0 && o.atk < 0.4) ? (1 - o.atk / 0.4) * 7 : 0;
  c.save(); c.translate(6 - rec, -60); c.rotate(-0.06);
  rr(c, -10, -4, 36, 11, 4, '#6b4423');
  ln(c, 24, 0, 74, -1, 6, '#575c68');
  rr(c, 66, -6, 8, 12, 3, '#2d313b');
  if (o.atk > 0 && o.atk < 0.3) poly(c, [[76, -1], [88, -12], [86, -2], [102, 0], [86, 3], [90, 13], [78, 4]], '#ffd23a');
  c.restore();
  ell(c, 20, -60, 8, 7, '#f0b98d'); ell(c, 2, -56, 7, 7, '#f0b98d');
  c.restore();
}

function drawIceGolem(c, o) {
  L(c);
  const s = Math.sin(o.t * 7) * o.walk, bob = -Math.abs(Math.cos(o.t * 7)) * 3 * o.walk, sw = swing(o.atk);
  rr(c, -28 + s * 6, -30, 20, 30, 6, '#8fd0f5'); rr(c, 8 - s * 6, -30, 20, 30, 6, '#8fd0f5');
  c.save(); c.translate(0, bob);
  c.save(); c.translate(-30, -76); c.rotate(-0.1 - s * 0.3); rr(c, -10, 0, 18, 38, 7, '#7cc0ec'); ell(c, -1, 42, 13, 12, '#a8dcfa'); c.restore();
  poly(c, [[-32, -40], [-24, -84], [0, -94], [26, -82], [34, -40], [12, -28], [-14, -28]], '#a8dcfa');
  poly(c, [[-24, -84], [0, -94], [-4, -62], [-20, -58]], '#e2f6ff');
  poly(c, [[26, -82], [34, -40], [16, -46], [12, -70]], '#7cc0ec');
  rr(c, -30, -52, 60, 11, 3, o.col);
  poly(c, [[-32, -82], [-46, -108], [-22, -90]], '#e2f6ff'); poly(c, [[24, -88], [38, -114], [32, -84]], '#e2f6ff');
  rr(c, -13, -116, 28, 26, 8, '#c4e8fc');
  ell(c, -4, -104, 4, 5, '#fff'); ell(c, 8, -104, 4, 5, '#fff'); ell(c, -3, -103, 2.2, 3, '#1e7bff'); ell(c, 9, -103, 2.2, 3, '#1e7bff');
  c.save(); c.translate(28, -76); c.rotate(0.1 + s * 0.3 + sw * 1.0); rr(c, -8, 0, 18, 38, 7, '#9bd6f7'); ell(c, 1, 43, 14, 13, '#c4e8fc'); c.restore();
  c.restore();
}

function drawIceSpirit(c, o) {
  L(c);
  ell(c, -18, -14, 14, 8, '#bfe9ff', -0.5); ell(c, -26, -8, 8, 5, '#dff4ff', -0.3);
  poly(c, [[-14, -52], [-14, -76], [-3, -56]], '#bfe9ff'); poly(c, [[14, -52], [14, -76], [3, -56]], '#bfe9ff');
  ell(c, 0, -34, 25, 27, '#8fd8ff');
  c.save(); c.lineWidth = 0; ell(c, -9, -46, 9, 6, '#e6f8ff', -0.4); c.restore();
  L(c);
  ell(c, -9, -36, 6.5, 9, '#fff'); ell(c, 9, -36, 6.5, 9, '#fff');
  ell(c, -8, -35, 3.2, 5, '#1e5bd8'); ell(c, 10, -35, 3.2, 5, '#1e5bd8');
  c.beginPath(); c.arc(0, -24, 5, 0.2, Math.PI - 0.2); c.stroke();
  ell(c, -26, -30, 6, 9, '#8fd8ff', 0.3); ell(c, 26, -30, 6, 9, '#8fd8ff', -0.3);
  poly(c, [[0, -62], [5, -56], [0, -50], [-5, -56]], o.col);
  const sp = o.t * 3;
  c.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { const a = sp + i * 2.1; c.beginPath(); c.arc(Math.cos(a) * 34, -36 + Math.sin(a) * 20, 2.5, 0, 6.3); c.fill(); }
}

function drawSkeleton(c, o) {
  L(c, 3.5);
  const s = Math.sin(o.t * 18) * o.walk, bob = -Math.abs(Math.cos(o.t * 18)) * 3 * o.walk, sw = swing(o.atk);
  ln(c, -6, -22, -6 + s * 8, 0, 5, '#efe9d6'); ln(c, 6, -22, 6 - s * 8, 0, 5, '#efe9d6');
  c.save(); c.translate(0, bob);
  rr(c, -11, -50, 22, 30, 6, '#efe9d6');
  c.lineWidth = 2; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-7, -44 + i * 8); c.lineTo(7, -44 + i * 8); c.stroke(); } L(c, 3.5);
  ell(c, 0, -64, 16, 15, '#f6f1e0');
  ell(c, -5.5, -65, 4.5, 5.5, '#14101c'); ell(c, 6, -65, 4.5, 5.5, '#14101c');
  poly(c, [[0, -60], [-2, -56], [2, -56]], '#14101c');
  rr(c, -16, -76, 32, 7, 3, o.col);
  c.save(); c.translate(11, -46); c.rotate(-0.5 + sw * 0.9);
  ln(c, 0, 0, 0, 14, 5, '#efe9d6'); ln(c, 0, 12, 0, 40, 6, '#c9d1d9'); rr(c, -6, 10, 12, 4, 2, '#8a5a1a');
  c.restore();
  ln(c, -11, -44, -15, -30, 5, '#efe9d6');
  c.restore();
}

function drawCannon(c, o) {
  L(c);
  ell(c, 0, -6, 36, 13, '#7a5a3a');
  const rec = o.atk > 0 ? Math.sin(o.atk * Math.PI) * 10 : 0;
  rr(c, -12, -34, 24, 16, 4, '#5a3a20');
  c.save(); c.translate(-rec, -36); c.rotate(-0.1);
  rr(c, -20, -12, 64, 26, 11, '#4a4f5c');
  rr(c, 40, -15, 12, 32, 4, '#2d313b');
  rr(c, -20, -12, 15, 26, 6, o.col);
  ln(c, -2, -6, 34, -6, 3, '#7b8190');
  c.restore();
  ell(c, -20, -18, 17, 17, '#6a4326'); ell(c, -20, -18, 6, 6, '#2b1a0d');
  c.lineWidth = 2.5; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4 + 0.3; c.beginPath(); c.moveTo(-20 + Math.cos(a) * 6, -18 + Math.sin(a) * 6); c.lineTo(-20 + Math.cos(a) * 15, -18 + Math.sin(a) * 15); c.stroke(); } L(c);
  ell(c, 22, -14, 13, 13, '#6a4326'); ell(c, 22, -14, 5, 5, '#2b1a0d');
}

function drawBrickLines(c, x0, x1, y0, y1, step) {

class Sfx {
  constructor() { this.ctx = null; this.muted = false; this.last = {}; this.nbuf = null; }

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; }

  }
  play(n) {
    if (!this.ctx || this.muted) return;
    const now = performance.now(); if (this.last[n] && now - this.last[n] < 45) return; this.last[n] = now;

      case 'hit': this.noise(.06, .22, 2200, 0, 800); this.tone(170, 80, .07, 'square', .1); break;

/* =====================================================================
   Particle : 불꽃/연기/파편/링/텍스트 등 모든 이펙트
   ===================================================================== */
class Particle {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, g: 0, life: 1, size: 4, col: '#fff', kind: 'dot', grow: 0, rot: 0, vr: 0, str: '', drag: 0, x2: 0, y2: 0 }, o);
    this.max = this.life;
  }
  update(dt) {
    this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt;
    this.vz -= this.g * dt; this.z += this.vz * dt;
    if (this.g > 0 && this.z < 0) { this.z = 0; this.vz *= -0.3; this.vx *= 0.6; this.vy *= 0.6; }
    this.size = Math.max(0, this.size + this.grow * dt); this.rot += this.vr * dt;
    if (this.drag) { const k = Math.exp(-this.drag * dt); this.vx *= k; this.vy *= k; }
  }
  get dead() { return this.life <= 0; }
}

}

    if (this.deploy > 0) { this.deploy -= dt; return; }
    if (this.freeze > 0) this.freeze -= dt;
    if (this.slow > 0) this.slow -= dt;
    if (Math.abs(this.kx) + Math.abs(this.ky) > 0.05) {

    }

    const sl = this.slow > 0 ? CONFIG.slowMul : 1;
    this.cd -= dt * sl; if (this.atkT > 0) this.atkT -= dt;
    if (this.pending) { this.pending.t -= dt * sl; if (this.pending.t <= 0) this.resolve(g); }
    this.rt -= dt;
    if (this.rt <= 0 || !this.target || !this.target.targetable) { this.target = g.pickTarget(this); this.rt = 0.3; }

    if (t) {

      } else if (this.atkT <= 0 && !this.pending) {
        const w = g.waypoint(this, t), dx = w.x - this.x, dy = w.y - this.y, len = Math.hypot(dx, dy) || 1;
        const step = Math.min(len, this.speed * sl * dt);

    else if (this.c.hop) this.z = moving ? Math.abs(Math.sin(this.t * 8)) * 0.35 : 0;
  }
  startAttack(g, t) {

  resolve(g) {

      const k = c.kamikaze;
      g.aoe(this.x, this.y, k.radius, k.dmg, this.team, { freeze: k.freeze, towerMul: 1 });
      g.parts.push(new Particle({ x: this.x, y: this.y, kind: 'ring', col: '#bfeaff', life: .5, size: .4, grow: k.radius * 2.4 }));
      for (let i = 0; i < 26; i++) { const a = rnd(0, 6.28), s = rnd(2, 7); g.parts.push(new Particle({ x: this.x, y: this.y, z: .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(1, 4), g: 9, life: rnd(.4, 1), size: rnd(2, 5), col: i % 3 ? '#e8f8ff' : '#7fd0ff' })); }
      g.sfx.play('freeze'); this.hp = 0; this.die(g); return;
    }

  }
}

/* =====================================================================
   Projectile : 실제로 날아가는 투사체 (화살/탄환/포탄)
   ===================================================================== */
class Projectile {
  constructor(team, x, y, z0, target, dmg, speed, kind) {
    this.team = team; this.x = x; this.y = y; this.z0 = z0; this.z = z0; this.target = target; this.dmg = dmg; this.speed = speed; this.kind = kind;
    this.lx = target.x; this.ly = target.y; this.d0 = Math.max(0.5, Math.hypot(target.x - x, target.y - y)); this.ang = 0; this.done = false; this.orphan = false;
  }
  update(dt, g) {
    let tx, ty;
    if (this.target && !this.target.dead) { tx = this.lx = this.target.x; ty = this.ly = this.target.y; } else { tx = this.lx; ty = this.ly; this.orphan = true; }
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    this.ang = Math.atan2(dy, dx);
    const reach = this.orphan ? 0.1 : Math.min(0.4, this.target.r * 0.7);
    if (d <= step + reach) {
      if (!this.orphan) { this.target.hit(this.dmg, g, this); g.hitFx(tx, ty, this.kind); g.sfx.play('hit'); }
      this.done = true; return;
    }
    this.x += dx / d * step; this.y += dy / d * step;
    this.z = 0.6 + (this.z0 - 0.6) * clamp(d / this.d0, 0, 1);
    if (this.kind === 'bullet') g.parts.push(new Particle({ kind: 'trail', x: this.x, y: this.y, z: this.z, x2: this.x - Math.cos(this.ang) * 1.4, y2: this.y - Math.sin(this.ang) * 1.4, life: .12, col: '#ffe48a', size: 3 }));
    else if (this.kind === 'ball') g.parts.push(new Particle({ kind: 'smoke', x: this.x, y: this.y, z: this.z, life: .25, size: 3, grow: 8, col: '#aaa' }));
  }
}

/* =====================================================================
   Spell : 파이어볼 / 통나무
   ===================================================================== */
class Spell {
  constructor(g, team, id, x, y) {
    this.team = team; this.id = id; this.c = CONFIG.cards[id]; this.done = false; this.tx = x; this.ty = y; this.x = x; this.y = y; this.t = 0;
    if (id === 'fireball') { this.sx = x; this.sy = team === 0 ? 33 : -1.5; this.dur = 0.95; this.x = this.sx; this.y = this.sy; this.z = 0; }
    else { this.dir = team === 0 ? -1 : 1; this.traveled = 0; this.hitSet = new Set(); this.y0 = y; }
  }
  update(dt, g) {
    if (this.id === 'fireball') {
      this.t += dt; const p = clamp(this.t / this.dur, 0, 1);
      this.x = this.sx + (this.tx - this.sx) * p; this.y = this.sy + (this.ty - this.sy) * p; this.z = Math.sin(p * Math.PI) * 5;
      for (let i = 0; i < 2; i++) g.parts.push(new Particle({ kind: 'fire', x: this.x + rnd(-.2, .2), y: this.y + rnd(-.2, .2), z: this.z + rnd(-.1, .2), life: rnd(.25, .45), size: rnd(.25, .45), col: i ? '#ffb21a' : '#ff5a1a', grow: -.5 }));
      if (p >= 1) {
        const c = this.c;
        g.aoe(this.tx, this.ty, c.radius, c.dmg, this.team, { towerMul: c.towerMul, kb: c.kb });
        g.explosion(this.tx, this.ty, c.radius * .8); g.shake = Math.max(g.shake, 9); g.sfx.play('boom'); this.done = true;
      }
    } else {
      const c = this.c, step = c.speed * dt;
      this.y += this.dir * step; this.traveled += step;
      for (const e of g.ents) {
        if (e.team === this.team || e.dead || this.hitSet.has(e)) continue;
        if (Math.abs(e.x - this.x) <= c.width / 2 + e.r * 0.6 && Math.abs(e.y - this.y) <= 0.55 + e.r * 0.6) {
          this.hitSet.add(e);
          e.hit(c.dmg * (e.isTower ? c.towerMul : 1), g, this); g.hitFx(e.x, e.y, 'melee'); g.sfx.play('hit');
          if (e.isUnit) { const f = c.kb * 6 / Math.sqrt(Math.max(1, e.mass / 1.5)); e.ky += this.dir * f; e.kx += (e.x - this.x) * 1.2; }
        }
      }
      for (let i = 0; i < 3; i++) g.parts.push(new Particle({ kind: 'smoke', x: this.x + rnd(-c.width / 2, c.width / 2), y: this.y - this.dir * rnd(.3, .8), z: rnd(0, .4), vz: rnd(.5, 1.5), life: rnd(.4, .8), size: rnd(4, 7), grow: 14, col: '#b79a72' }));
      if (this.traveled >= c.length) this.done = true;
    }
  }
}

/* =====================================================================
   CardHand : 8장 덱, 손패 4 + 다음 카드 1, 사용하면 맨 뒤로 순환
   ===================================================================== */
class CardHand {
  constructor(ids) { const a = shuffle(ids.slice()); this.hand = a.slice(0, 4); this.next = a[4]; this.rest = a.slice(5); }
  slotOf(id) { return this.hand.indexOf(id); }
  use(slot) { const id = this.hand[slot]; this.hand[slot] = this.next; this.next = this.rest.shift(); this.rest.push(id); return id; }
}

/* =====================================================================
   AIPlayer : 상황 대응형 상대 (호그 사이클)
   ===================================================================== */
class AIPlayer {
  constructor(g, team, diff) {
    this.g = g; this.team = team; this.d = CONFIG.diff[diff]; this.hand = new CardHand(CONFIG.deck);
    this.elixir = CONFIG.elixirStart; this.reactT = 0; this.tick = 2; this.cool = 3;
  }
  play(id, x, y) {
    const slot = this.hand.slotOf(id), c = CONFIG.cards[id];
    if (slot < 0 || this.elixir < c.cost) return false;
    if (c.type !== 'spell') { x = clamp(x, 1, 17); y = clamp(y, 1.5, 14.2); } else { x = clamp(x, 1, 17); y = clamp(y, 0.5, 30); }
    this.elixir -= c.cost; this.hand.use(slot); this.g.deploy(this.team, id, x, y);
    this.cool = rnd(this.d.gap * 0.7, this.d.gap * 1.3); return true;
  }
  update(dt) {
    this.elixir = Math.min(CONFIG.elixirMax, this.elixir + dt * this.g.elixirRate);
    this.cool -= dt; this.tick -= dt; if (this.tick > 0) return; this.tick = 0.25;
    if (this.cool > 0) return;
    const g = this.g, my = this.team, d = this.d;
    const foes = g.ents.filter(e => e.isUnit && e.team !== my && !e.dead && e.deploy <= 0);
    const hogs = foes.filter(u => u.id === 'hog' && u.y < 19).sort((a, b) => a.y - b.y);
    const inside = foes.filter(u => u.id !== 'hog' && u.y < 15.5);
    const hasCannon = g.ents.some(e => e.team === my && e.id === 'cannon' && !e.dead);
    const threat = hogs.length > 0 || inside.length > 0;
    if (threat) {
      this.reactT += 0.25;
      if (this.reactT >= d.react) {
        if (Math.random() < d.mistake) { this.cool = rnd(.8, 1.8); this.reactT = 0; return; }   // 실수: 반응 놓침
        if (this.defend(hogs, inside, hasCannon)) { this.reactT = 0; return; }
      }
    } else this.reactT = 0;
    if (!threat || this.elixir >= 9.5) this.attack();
  }
  defend(hogs, inside, hasCannon) {
    const off = () => (Math.random() < this.d.mistake ? rnd(-3, 3) : 0);
    if (hogs.length) {
      const h = hogs[0], lx = h.x < 9 ? 6.5 : 11.5;
      if (!hasCannon && this.play('cannon', lx + off(), 10.2)) return true;
      if (this.play('skeletons', h.x + off(), Math.max(9, h.y - 2.5))) return true;
      if (this.play('icespirit', h.x + off(), Math.max(8.5, h.y - 2))) return true;
      if (this.play('icegolem', h.x, 10)) return true;
    }
    if (inside.length) {
      let cx = 0, cy = 0; inside.forEach(u => { cx += u.x; cy += u.y; }); cx /= inside.length; cy /= inside.length;
      const cl = inside.filter(u => Math.hypot(u.x - cx, u.y - cy) < 3.4);
      if (cl.length >= 3 && this.play('log', cx + off(), clamp(cy - 3.5, 2, 14.5))) return true;
      if ((cl.some(u => u.id === 'musketeer') || cl.length >= 3) && this.play('fireball', cx, cy)) return true;
      if (this.play('skeletons', cx, Math.max(8, cy - 2.5))) return true;
      if (this.play('icespirit', cx, Math.max(8, cy - 2))) return true;
      if (!hasCannon && this.play('cannon', cx < 9 ? 6.5 : 11.5, 10.2)) return true;
      if (this.play('musketeer', cx, 7)) return true;
    }
    return false;
  }
  chooseLane() {
    const T = this.g.towers[1 - this.team];
    if (T.pl.dead) return 3.5; if (T.pr.dead) return 14.5;
    if (Math.random() < 0.3) return Math.random() < .5 ? 3.5 : 14.5;
    return T.pl.hp <= T.pr.hp ? 3.5 : 14.5;
  }
  attack() {
    const g = this.g, my = this.team, e = this.elixir;
    if (e < this.d.pushE && e < 9.6) return;
    const golem = g.ents.find(x => x.id === 'icegolem' && x.team === my && !x.dead);
    const lane = this.chooseLane(), bad = Math.random() < this.d.mistake;
    if (!golem && this.play('icegolem', bad ? 9 : lane, 3.5)) return;
    if (golem && e >= 4 && this.play('hog', golem.x < 9 ? 3.5 : 14.5, clamp(golem.y - 2, 3, 13))) return;
    if (!golem && e >= 9 && this.play('hog', lane, 12)) return;
    if (e >= 9.6) { if (this.play('musketeer', lane < 9 ? 5 : 13, 6)) return; if (this.play('icespirit', lane, 12)) return; this.play('skeletons', lane, 12); }
  }
}

/* =====================================================================
   Arena : 맵 규칙(레인/다리/배치 영역/경로)
   ===================================================================== */
class Arena {
  constructor() { this.R = CONFIG.river; }
  bridgeFor(x, tx) {   // 가장 효율적인 다리
    let best = CONFIG.bridges[0], bs = 1e9;
    for (const b of CONFIG.bridges) { const s = Math.abs(x - b) + Math.abs(b - tx); if (s < bs) { bs = s; best = b; } }
    return best;
  }
  nearestBridge(x) { return Math.abs(x - CONFIG.bridges[0]) <= Math.abs(x - CONFIG.bridges[1]) ? CONFIG.bridges[0] : CONFIG.bridges[1]; }
  canDeploy(g, team, x, y) {
    if (x < 0.6 || x > 17.4 || y < 0.6 || y > 31.4) return false;
    const R = this.R;
    for (const k in g.towers[0]) for (const tw of [g.towers[0][k], g.towers[1][k]]) if (!tw.dead && Math.hypot(tw.x - x, tw.y - y) < tw.r + 0.4) return false;
    if (team === 0) {
      if (y >= R.bot + 0.3) return true;
      const e = g.towers[1];
      if (y >= 11 && y < R.top - 0.3) { if (x < 9 && e.pl.dead) return true; if (x >= 9 && e.pr.dead) return true; }
      return false;
    }
    if (y <= R.top - 0.3) return true;
    const e = g.towers[0];
    if (y <= 21 && y > R.bot + 0.3) { if (x < 9 && e.pl.dead) return true; if (x >= 9 && e.pr.dead) return true; }
    return false;
  }
  /* 다음에 향할 지점 (다리 경유) */
  waypoint(u, t) {
    const R = this.R;
    if (u.c.jump) return t;
    const us = u.y < (R.top + R.bot) / 2 ? 0 : 1, ts = t.y < (R.top + R.bot) / 2 ? 0 : 1;
    if (us === ts) return t;

    const end = e => {
      if (!this.drag) return; const p = this.toLogical(e); this.drag.px = p.x; this.drag.py = p.y; this.updateDrag();
      const d = this.drag; this.drag = null;
      if (e.type !== 'pointercancel' && d.inArena && d.valid && this.state === 'play' && !this.ending && this.elixir >= d.cfg.cost) {
        this.elixir -= d.cfg.cost; this.hand.use(d.slot); this.cardPop[d.slot] = 1;
        this.deploy(0, d.id, d.tx, d.ty);
      } else if (d.inArena && !d.valid && e.type !== 'pointercancel') this.sfx.play('deny');
    };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('contextmenu', e => e.preventDefault());
  }
  updateDrag() {
    const d = this.drag; if (!d) return;
    const T = CONFIG.T, py = d.py - (d.touch ? 46 : 0);
    d.tx = (d.px - CONFIG.AX) / T; d.ty = (py - CONFIG.AY) / T;
    d.inArena = d.tx >= 0 && d.tx <= 18 && d.ty >= 0 && d.ty <= 32 && d.py < CONFIG.AY + 32 * T + (d.touch ? 30 : 0);
    d.tx = clamp(d.tx, 0.6, 17.4); d.ty = clamp(d.ty, 0.6, 31.4);
    if (!d.inArena) { d.valid = false; return; }
    d.valid = d.cfg.type === 'spell' ? true : this.arena.canDeploy(this, 0, d.tx, d.ty);
  }

  loop(ts) {
    const dt = Math.min(0.05, (ts - this.last) / 1000); this.last = ts;
    this.update(dt); this.renderer.render();
    requestAnimationFrame(t => this.loop(t));
  }
}

/* ---------------- 부트스트랩 ---------------- */
const cv = document.getElementById('cv'), stage = document.getElementById('stage');
const game = new Game(cv);
function resize() {
  const s = Math.min(innerWidth / CONFIG.W, innerHeight / CONFIG.H), w = CONFIG.W * s, h = CONFIG.H * s, dpr = Math.min(window.devicePixelRatio || 1, 2);
  stage.style.width = w + 'px'; stage.style.height = h + 'px'; stage.style.fontSize = (16 * s) + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); game.scale = cv.width / CONFIG.W;
}
addEventListener('resize', resize); resize();
let selDiff = 'normal';
document.querySelectorAll('#diffRow button').forEach(b => b.addEventListener('click', () => {
  selDiff = b.dataset.d; document.querySelectorAll('#diffRow button').forEach(x => x.classList.toggle('sel', x === b));
}));
document.getElementById('startBtn').addEventListener('click', () => { game.sfx.unlock(); game.start(selDiff); });
document.getElementById('againBtn').addEventListener('click', () => { game.sfx.unlock(); game.start(selDiff); });
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('result').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); game.state = 'menu'; game.reset();
});

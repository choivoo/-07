<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>호그 사이클 로얄</title>
<style>
html,body{margin:0;height:100%;background:#150e26;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:540px;height:960px;font-size:16px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center;color:#fff;background:rgba(20,10,40,.82)}
.ov.hidden{display:none}
.ov h1{margin:0;font-size:3em;line-height:1.1;color:#ffd23a;text-shadow:0 .1em 0 #14101c,0 0 .5em #ff8a00;-webkit-text-stroke:.05em #14101c;paint-order:stroke fill}
.ov h2{margin:0;font-size:3.2em;-webkit-text-stroke:.05em #14101c;paint-order:stroke fill}
.ov p{margin:.2em 0;font-size:1.1em}
.ov small{opacity:.8;font-size:.85em;max-width:80%}
.row{display:flex;gap:.6em}
button{font:inherit;font-weight:900;font-size:1.2em;color:#fff;background:linear-gradient(#5aa8ff,#2a62d8);border:.18em solid #14101c;border-radius:.6em;padding:.45em 1.1em;cursor:pointer;box-shadow:0 .2em 0 #14101c}
button:active{transform:translateY(.12em);box-shadow:0 .08em 0 #14101c}
button.sel{background:linear-gradient(#ffd23a,#f59a23);color:#14101c}
button.big{font-size:1.6em;background:linear-gradient(#ff8a5a,#e83a2a)}
#crowns{font-size:3em;letter-spacing:.1em}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <canvas id="cv"></canvas>
  <div id="menu" class="ov">
   <h1>호그 사이클<br>로얄</h1>
   <p>난이도를 선택하세요</p>
   <div class="row" id="diffRow">
    <button data-d="easy">쉬움</button>
    <button data-d="normal" class="sel">보통</button>
    <button data-d="hard">어려움</button>
   </div>
   <button id="startBtn" class="big">전투 시작!</button>
   <small>카드를 아래에서 끌어다 내 진영(아래쪽 파랑)에 놓으세요.<br>주문은 어디든 놓을 수 있어요. 상대 프린세스타워를 부수면 그쪽 레인 배치 영역이 넓어집니다.</small>
  </div>
  <div id="result" class="ov hidden">
   <h2 id="resTitle">승리!</h2>
   <div id="crowns"></div>
   <p id="resSub"></p>
   <div class="row">
    <button id="againBtn" class="big">다시 시작</button>
    <button id="menuBtn">난이도 선택</button>
   </div>
  </div>
 </div>
</div>

class Sfx {

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; }

      case 'arrow': this.tone(1300, 700, .05, 'square', .05); break;

/* =====================================================================
   Particle : 불꽃/연기/파편/링/텍스트 등 모든 이펙트
   ===================================================================== */
class Particle {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, g: 0, life: 1, size: 4, col: '#fff', kind: 'dot', grow: 0, rot: 0, vr: 0, str: '', drag: 0, x2: 0, y2: 0 }, o);

  }
  update(dt) {
    this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt;
    this.vz -= this.g * dt; this.z += this.vz * dt;
    if (this.g > 0 && this.z < 0) { this.z = 0; this.vz *= -0.3; this.vx *= 0.6; this.vy *= 0.6; }

class Unit extends Entity {

class Building extends Entity {
  constructor(team, id, x, y) {

  }

  hit(d, g) { if (this.dead) return; this.hp -= d; this.flash = 0.12; if (this.hp <= 0) this.die(g); }
  die(g) {
    if (this.dead) return; this.dead = true; this.deadT = 0.5; this.hp = 0; g.explosion(this.x, this.y, 1.2); g.sfx.play('boom');

class Tower extends Entity {

/* =====================================================================

    this.lx = target.x; this.ly = target.y; this.d0 = Math.max(0.5, Math.hypot(target.x - x, target.y - y)); this.ang = 0; this.done = false; this.orphan = false;

      this.done = true; return;

/* =====================================================================

class Spell {
  constructor(g, team, id, x, y) {

    if (id === 'fireball') { this.sx = x; this.sy = team === 0 ? 33 : -1.5; this.dur = 0.95; this.x = this.sx; this.y = this.sy; this.z = 0; }
    else { this.dir = team === 0 ? -1 : 1; this.traveled = 0; this.hitSet = new Set(); this.y0 = y; }
  }
  update(dt, g) {
    if (this.id === 'fireball') {
      this.t += dt; const p = clamp(this.t / this.dur, 0, 1);
      this.x = this.sx + (this.tx - this.sx) * p; this.y = this.sy + (this.ty - this.sy) * p; this.z = Math.sin(p * Math.PI) * 5;
      for (let i = 0; i < 2; i++) g.parts.push(new Particle({ kind: 'fire', x: this.x + rnd(-.2, .2), y: this.y + rnd(-.2, .2), z: this.z + rnd(-.1, .2), life: rnd(.25, .45), size: rnd(.25, .45), col: i ? '#ffb21a' : '#ff5a1a', grow: -.5 }));
      if (p >= 1) {

        g.explosion(this.tx, this.ty, c.radius * .8); g.shake = Math.max(g.shake, 9); g.sfx.play('boom'); this.done = true;
      }
    } else {
      const c = this.c, step = c.speed * dt;
      this.y += this.dir * step; this.traveled += step;
      for (const e of g.ents) {

        if (Math.abs(e.x - this.x) <= c.width / 2 + e.r * 0.6 && Math.abs(e.y - this.y) <= 0.55 + e.r * 0.6) {
          this.hitSet.add(e);
          e.hit(c.dmg * (e.isTower ? c.towerMul : 1), g, this); g.hitFx(e.x, e.y, 'melee'); g.sfx.play('hit');
          if (e.isUnit) { const f = c.kb * 6 / Math.sqrt(Math.max(1, e.mass / 1.5)); e.ky += this.dir * f; e.kx += (e.x - this.x) * 1.2; }
        }

      for (let i = 0; i < 3; i++) g.parts.push(new Particle({ kind: 'smoke', x: this.x + rnd(-c.width / 2, c.width / 2), y: this.y - this.dir * rnd(.3, .8), z: rnd(0, .4), vz: rnd(.5, 1.5), life: rnd(.4, .8), size: rnd(4, 7), grow: 14, col: '#b79a72' }));
      if (this.traveled >= c.length) this.done = true;
    }
  }
}

/* =====================================================================
   CardHand : 8장 덱, 손패 4 + 다음 카드 1, 사용하면 맨 뒤로 순환
   ===================================================================== */
class CardHand {
  constructor(ids) { const a = shuffle(ids.slice()); this.hand = a.slice(0, 4); this.next = a[4]; this.rest = a.slice(5); }
  slotOf(id) { return this.hand.indexOf(id); }
  use(slot) { const id = this.hand[slot]; this.hand[slot] = this.next; this.next = this.rest.shift(); this.rest.push(id); return id; }
}

/* =====================================================================
   AIPlayer : 상황 대응형 상대 (호그 사이클)
   ===================================================================== */
class AIPlayer {
  constructor(g, team, diff) {
    this.g = g; this.team = team; this.d = CONFIG.diff[diff]; this.hand = new CardHand(CONFIG.deck);
    this.elixir = CONFIG.elixirStart; this.reactT = 0; this.tick = 2; this.cool = 3;
  }
  play(id, x, y) {
    const slot = this.hand.slotOf(id), c = CONFIG.cards[id];
    if (slot < 0 || this.elixir < c.cost) return false;
    if (c.type !== 'spell') { x = clamp(x, 1, 17); y = clamp(y, 1.5, 14.2); } else { x = clamp(x, 1, 17); y = clamp(y, 0.5, 30); }
    this.elixir -= c.cost; this.hand.use(slot); this.g.deploy(this.team, id, x, y);
    this.cool = rnd(this.d.gap * 0.7, this.d.gap * 1.3); return true;
  }
  update(dt) {
    this.elixir = Math.min(CONFIG.elixirMax, this.elixir + dt * this.g.elixirRate);
    this.cool -= dt; this.tick -= dt; if (this.tick > 0) return; this.tick = 0.25;
    if (this.cool > 0) return;
    const g = this.g, my = this.team, d = this.d;
    const foes = g.ents.filter(e => e.isUnit && e.team !== my && !e.dead && e.deploy <= 0);
    const hogs = foes.filter(u => u.id === 'hog' && u.y < 19).sort((a, b) => a.y - b.y);
    const inside = foes.filter(u => u.id !== 'hog' && u.y < 15.5);
    const hasCannon = g.ents.some(e => e.team === my && e.id === 'cannon' && !e.dead);
    const threat = hogs.length > 0 || inside.length > 0;
    if (threat) {
      this.reactT += 0.25;
      if (this.reactT >= d.react) {
        if (Math.random() < d.mistake) { this.cool = rnd(.8, 1.8); this.reactT = 0; return; }   // 실수: 반응 놓침
        if (this.defend(hogs, inside, hasCannon)) { this.reactT = 0; return; }
      }
    } else this.reactT = 0;
    if (!threat || this.elixir >= 9.5) this.attack();
  }
  defend(hogs, inside, hasCannon) {
    const off = () => (Math.random() < this.d.mistake ? rnd(-3, 3) : 0);
    if (hogs.length) {
      const h = hogs[0], lx = h.x < 9 ? 6.5 : 11.5;
      if (!hasCannon && this.play('cannon', lx + off(), 10.2)) return true;
      if (this.play('skeletons', h.x + off(), Math.max(9, h.y - 2.5))) return true;
      if (this.play('icespirit', h.x + off(), Math.max(8.5, h.y - 2))) return true;
      if (this.play('icegolem', h.x, 10)) return true;
    }
    if (inside.length) {
      let cx = 0, cy = 0; inside.forEach(u => { cx += u.x; cy += u.y; }); cx /= inside.length; cy /= inside.length;
      const cl = inside.filter(u => Math.hypot(u.x - cx, u.y - cy) < 3.4);
      if (cl.length >= 3 && this.play('log', cx + off(), clamp(cy - 3.5, 2, 14.5))) return true;
      if ((cl.some(u => u.id === 'musketeer') || cl.length >= 3) && this.play('fireball', cx, cy)) return true;
      if (this.play('skeletons', cx, Math.max(8, cy - 2.5))) return true;
      if (this.play('icespirit', cx, Math.max(8, cy - 2))) return true;
      if (!hasCannon && this.play('cannon', cx < 9 ? 6.5 : 11.5, 10.2)) return true;
      if (this.play('musketeer', cx, 7)) return true;
    }
    return false;
  }
  chooseLane() {
    const T = this.g.towers[1 - this.team];
    if (T.pl.dead) return 3.5; if (T.pr.dead) return 14.5;
    if (Math.random() < 0.3) return Math.random() < .5 ? 3.5 : 14.5;
    return T.pl.hp <= T.pr.hp ? 3.5 : 14.5;
  }
  attack() {
    const g = this.g, my = this.team, e = this.elixir;
    if (e < this.d.pushE && e < 9.6) return;
    const golem = g.ents.find(x => x.id === 'icegolem' && x.team === my && !x.dead);
    const lane = this.chooseLane(), bad = Math.random() < this.d.mistake;
    if (!golem && this.play('icegolem', bad ? 9 : lane, 3.5)) return;
    if (golem && e >= 4 && this.play('hog', golem.x < 9 ? 3.5 : 14.5, clamp(golem.y - 2, 3, 13))) return;
    if (!golem && e >= 9 && this.play('hog', lane, 12)) return;
    if (e >= 9.6) { if (this.play('musketeer', lane < 9 ? 5 : 13, 6)) return; if (this.play('icespirit', lane, 12)) return; this.play('skeletons', lane, 12); }
  }
}

/* =====================================================================
   Arena : 맵 규칙(레인/다리/배치 영역/경로)
   ===================================================================== */
class Arena {
  constructor() { this.R = CONFIG.river; }
  bridgeFor(x, tx) {   // 가장 효율적인 다리
    let best = CONFIG.bridges[0], bs = 1e9;
    for (const b of CONFIG.bridges) { const s = Math.abs(x - b) + Math.abs(b - tx); if (s < bs) { bs = s; best = b; } }
    return best;
  }
  nearestBridge(x) { return Math.abs(x - CONFIG.bridges[0]) <= Math.abs(x - CONFIG.bridges[1]) ? CONFIG.bridges[0] : CONFIG.bridges[1]; }
  canDeploy(g, team, x, y) {
    if (x < 0.6 || x > 17.4 || y < 0.6 || y > 31.4) return false;
    const R = this.R;
    for (const k in g.towers[0]) for (const tw of [g.towers[0][k], g.towers[1][k]]) if (!tw.dead && Math.hypot(tw.x - x, tw.y - y) < tw.r + 0.4) return false;
    if (team === 0) {
      if (y >= R.bot + 0.3) return true;
      const e = g.towers[1];
      if (y >= 11 && y < R.top - 0.3) { if (x < 9 && e.pl.dead) return true; if (x >= 9 && e.pr.dead) return true; }
      return false;
    }
    if (y <= R.top - 0.3) return true;
    const e = g.towers[0];
    if (y <= 21 && y > R.bot + 0.3) { if (x < 9 && e.pl.dead) return true; if (x >= 9 && e.pr.dead) return true; }
    return false;
  }
  /* 다음에 향할 지점 (다리 경유) */
  waypoint(u, t) {
    const R = this.R;
    if (u.c.jump) return t;
    const us = u.y < (R.top + R.bot) / 2 ? 0 : 1, ts = t.y < (R.top + R.bot) / 2 ? 0 : 1;
    if (us === ts) return t;
    const bx = this.bridgeFor(u.x, t.x), down = us === 0, inBand = u.y > R.top + 0.1 && u.y < R.bot - 0.1;
    if (inBand) return { x: bx, y: down ? R.bot + 0.8 : R.top - 0.8 };
    if (Math.abs(u.x - bx) > 0.5) return { x: bx, y: down ? R.top - 0.35 : R.bot + 0.35 };
    return { x: bx, y: down ? R.bot + 0.8 : R.top - 0.8 };
  }
}

    this.ai = null; this.drag = null; this.shake = 0; this.banner = null; this.ending = null; this.cdT = 3.8; this.lastCd = 4; this.fullWarned = false;
  }
  start(diff) {
    this.diff = diff; this.reset(); this.ai = new AIPlayer(this, 1, diff); this.state = 'countdown';
    document.getElementById('menu').classList.add('hidden'); document.getElementById('result').classList.add('hidden');
  }

  /* ---- 효과 헬퍼 ---- */
  puff(x, y, n, col, sz) { for (let i = 0; i < n; i++) this.parts.push(new Particle({ kind: 'smoke', x: x + rnd(-.3, .3), y: y + rnd(-.3, .3), z: rnd(0, .6), vx: rnd(-1, 1), vy: rnd(-1, 1), vz: rnd(.5, 1.5), life: rnd(.3, .6), size: sz, grow: 10, col })); }
  hitFx(x, y, kind) {
    const n = kind === 'ball' ? 8 : 5;
    for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(1.5, 4); this.parts.push(new Particle({ x, y, z: .6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(1, 3), g: 10, life: rnd(.2, .5), size: rnd(1.5, 3), col: kind === 'bullet' ? '#ffe48a' : '#fff' })); }
  }
  explosion(x, y, r) {
    this.parts.push(new Particle({ kind: 'ring', x, y, col: '#ffb21a', life: .45, size: .3, grow: r * 3.5 }));
    for (let i = 0; i < 26; i++) { const a = rnd(0, 6.28), s = rnd(1, 6) * (r / 1.5 + .4); this.parts.push(new Particle({ kind: 'fire', x, y, z: rnd(0, .5), vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(0, 3), life: rnd(.4, .9), size: rnd(.3, .7) * Math.max(.7, r / 1.5), col: ['#ff4a1a', '#ff7a1a', '#ffb21a', '#fff3a8'][i % 4], drag: 2 })); }
    for (let i = 0; i < 12; i++) { const a = rnd(0, 6.28), s = rnd(.5, 3); this.parts.push(new Particle({ kind: 'smoke', x, y, z: rnd(.2, 1), vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(.5, 2), life: rnd(.7, 1.3), size: rnd(8, 14), grow: 14, col: '#555' })); }
  }

  /* ---- 규칙 ---- */
  deploy(team, id, x, y) {
    const c = CONFIG.cards[id]; this.sfx.play(c.type === 'spell' ? 'place' : 'place');
    if (c.type === 'spell') { this.spells.push(new Spell(this, team, id, x, y)); return; }
    if (c.type === 'building') { this.ents.push(new Building(team, id, x, y)); this.puff(x, y, 6, '#c9b28a', 6); return; }
    const offs = c.count === 3 ? [[-.6, .35], [.6, .35], [0, -.5]] : [[0, 0]], dir = team === 0 ? 1 : -1;
    for (const o of offs) { const u = new Unit(team, id, x + o[0], y + o[1] * dir); u.fx = team === 0 ? 1 : -1; this.ents.push(u); this.puff(u.x, u.y, 4, '#c9b28a', 5); }
    if (c.shout) { this.sfx.play('hog'); this.parts.push(new Particle({ kind: 'text', x, y: y - 1, z: 2.5, vz: 1.5, life: 1.2, size: 28, col: '#ffd23a', str: c.shout })); }
  }
  pickTarget(u) {
    let best = null, bd = 1e9;
    for (const e of this.ents) {
      if (e.team === u.team || !e.targetable) continue;
      if (u.c.bldOnly && !e.isBuilding) continue;
      const d = Math.hypot(e.x - u.x, e.y - u.y) - e.r;
      if (!u.c.bldOnly && d > u.aggro) continue;
      if (d < bd) { bd = d; best = e; }
    }
    if (best) return best;
    const T = this.towers[1 - u.team], p = u.x < 9 ? T.pl : T.pr;
    return p.dead ? T.k : p;
  }
  waypoint(u, t) { return this.arena.waypoint(u, t); }
  aoe(x, y, rad, dmg, team, o) {
    for (const e of this.ents.slice()) {
      if (e.team === team || e.dead) continue;
      if (Math.hypot(e.x - x, e.y - y) - e.r > rad) continue;
      const dm = dmg * (e.isTower ? (o.towerMul === undefined ? 1 : o.towerMul) : 1);
      if (dm > 0) e.hit(dm, this);
      if (e.isUnit && !e.dead) {
        if (o.freeze) e.freeze = Math.max(e.freeze, o.freeze);
        if (o.slow) e.slow = Math.max(e.slow, o.slowT);
        if (o.kb) { const a = Math.atan2(e.y - y, e.x - x + 0.001), f = o.kb * 6 / Math.sqrt(Math.max(1, e.mass / 1.5)); e.kx += Math.cos(a) * f; e.ky += Math.sin(a) * f; }
      }
    }
  }
  onTowerDown(t) {
    const winner = 1 - t.team, king = t.kind === 'king';
    this.explosion(t.x, t.y, 2.2); this.shake = 14; this.sfx.play('tower');
    for (let i = 0; i < 22; i++) this.parts.push(new Particle({ kind: 'debris', x: t.x, y: t.y, z: 1, vx: rnd(-5, 5), vy: rnd(-5, 5), vz: rnd(3, 9), g: 16, life: rnd(.8, 1.6), size: rnd(4, 9), col: i % 3 ? '#9aa4b4' : TEAM_COL[t.team].main, vr: rnd(-9, 9) }));
    const before = this.crowns[winner]; this.crowns[winner] = king ? 3 : Math.min(3, before + 1);
    for (let i = before; i < this.crowns[winner]; i++) this.crownFx.push({ x: sx(t.x), y: sy(t.y), t: -(i - before) * .3, team: winner === 0 ? 1 : 0, slot: i });
    this.sfx.play('crown');
    if (!king) { const k = this.towers[t.team].k; if (!k.dead && !k.active) k.wake(this); }
    if (!this.ending && (king || this.overtime)) this.ending = { delay: 1.8 };
  }
  endMatch() {
    this.state = 'over'; this.drag = null;
    let w; const a = this.crowns[0], b = this.crowns[1];
    if (a !== b) w = a > b ? 0 : 1;
    else { const hp = tm => ['pl', 'pr', 'k'].reduce((s, k) => s + this.towers[tm][k].hp, 0); const h0 = hp(0), h1 = hp(1); w = Math.abs(h0 - h1) < 1 ? -1 : (h0 > h1 ? 0 : 1); }
    this.sfx.play(w === 0 ? 'win' : 'lose');
    const el = id => document.getElementById(id);
    el('resTitle').textContent = w === 0 ? '승리!' : w === 1 ? '패배...' : '무승부';
    el('resTitle').style.color = w === 0 ? '#ffd23a' : w === 1 ? '#ff6a6a' : '#fff';
    el('crowns').innerHTML = '<span style="color:#7fb4ff">' + '👑'.repeat(a) + '</span>' + (a ? '' : '–') + '&nbsp;:&nbsp;' + '<span style="color:#ff8a8a">' + '👑'.repeat(b) + '</span>' + (b ? '' : '–');
    el('resSub').textContent = '내 크라운 ' + a + '  /  상대 크라운 ' + b + (this.crowns[0] === this.crowns[1] ? '  (타워 체력 합산 판정)' : '');
    setTimeout(() => { if (this.state === 'over') el('result').classList.remove('hidden'); }, 700);
  }

  /* ---- 업데이트 ---- */
  update(dt) {
    this.anim += dt;
    this.shake = Math.max(0, this.shake - dt * 30);
    for (const f of this.crownFx) f.t += dt; this.crownFx = this.crownFx.filter(f => f.t < 1.6);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    for (let i = 0; i < 4; i++) { this.cardPop[i] = Math.max(0, this.cardPop[i] - dt * 4); this.cardDeny[i] = Math.max(0, this.cardDeny[i] - dt * 3); }
    if (this.state === 'countdown') {
      this.cdT -= dt;
      const n = Math.ceil(this.cdT - 0.8);
      const stage = this.cdT > 2.8 ? 3 : this.cdT > 1.8 ? 2 : this.cdT > 0.8 ? 1 : 0;
      if (stage !== this.lastCd) { this.lastCd = stage; this.sfx.play(stage ? 'tick' : 'go'); }
      if (this.cdT <= 0) this.state = 'play';
    } else if (this.state === 'play') this.simulate(dt);
    // 이펙트는 항상 갱신
    for (const p of this.parts) p.update(dt); this.parts = this.parts.filter(p => !p.dead);
    if (this.state === 'over') { for (const e of this.ents) if (e.isTower) e.t += dt; }
  }
  simulate(dt) {
    // 시간
    if (!this.ending) {
      if (!this.overtime) {
        this.clock -= dt;
        if (this.clock <= CONFIG.doubleAt && !this.double) { this.double = true; this.elixirRate = 2 / CONFIG.elixirBase; this.banner = { text: '엘릭서 2배!', t: 2, max: 2, col: '#ff7bff' }; this.sfx.play('full'); }
        if (this.clock <= 0) {
          this.clock = 0;
          if (this.crowns[0] === this.crowns[1]) { this.overtime = true; this.banner = { text: '연장전!', t: 2.4, max: 2.4, col: '#ffd23a' }; this.sfx.play('go'); }
          else this.endMatch();
        }
      } else { this.otClock -= dt; if (this.otClock <= 0) { this.otClock = 0; this.endMatch(); } }
    } else { this.ending.delay -= dt; if (this.ending.delay <= 0) { this.ending = null; this.endMatch(); return; } }
    // 엘릭서
    const prev = this.elixir; this.elixir = Math.min(CONFIG.elixirMax, this.elixir + dt * this.elixirRate);
    if (prev < 10 && this.elixir >= 10) this.sfx.play('full');
    if (!this.ending && this.ai) this.ai.update(dt);
    // 개체 갱신
    for (const e of this.ents) e.update(dt, this);
    for (const p of this.projs) p.update(dt, this); this.projs = this.projs.filter(p => !p.done);
    for (const s of this.spells) s.update(dt, this); this.spells = this.spells.filter(s => !s.done);
    this.collide();
    this.ents = this.ents.filter(e => !e.dead || e.keep || e.deadT > 0);
    if (this.drag) this.updateDrag();
  }
  collide() {
    const us = this.ents.filter(e => e.isUnit && !e.dead && e.deploy <= 0), R = CONFIG.river, bw = CONFIG.bridgeW / 2;
    for (let i = 0; i < us.length; i++) for (let j = i + 1; j < us.length; j++) {
      const a = us[i], b = us[j]; if (a.z > 0.3 || b.z > 0.3) continue;
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy); const min = (a.r + b.r) * 0.9;
      if (d >= min) continue;
      if (d < 0.001) { dx = rnd(-1, 1); dy = rnd(-1, 1); d = Math.hypot(dx, dy) || 1; }
      const push = (min - d), wa = b.mass / (a.mass + b.mass), wb = a.mass / (a.mass + b.mass);
      a.x -= dx / d * push * wa; a.y -= dy / d * push * wa; b.x += dx / d * push * wb; b.y += dy / d * push * wb;
    }
    for (const u of us) {
      for (const e of this.ents) {
        if (!e.isBuilding || e.dead || e.team === undefined) continue;
        const dx = u.x - e.x, dy = u.y - e.y, d = Math.hypot(dx, dy), min = e.r + u.r * 0.7;
        if (d < min && d > 0.001) { u.x = e.x + dx / d * min; u.y = e.y + dy / d * min; }
      }
      if (!u.c.jump && u.y > R.top - 0.15 && u.y < R.bot + 0.15) { const b = this.arena.nearestBridge(u.x); u.x = clamp(u.x, b - bw + u.r * 0.6, b + bw - u.r * 0.6); }
      u.x = clamp(u.x, 0.5, 17.5); u.y = clamp(u.y, 0.5, 31.5);
    }
  }

  /* ---- 입력 ---- */
  toLogical(e) { const r = this.cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * CONFIG.W, y: (e.clientY - r.top) / r.height * CONFIG.H }; }
  cardAt(p) {
    for (let i = 0; i < 4; i++) { const x = UI.cardX0 + i * (UI.cardW + UI.cardGap); if (p.x >= x && p.x <= x + UI.cardW && p.y >= UI.cardY && p.y <= UI.cardY + UI.cardH) return i; }
    return -1;
  }
  bindInput() {
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => {
      e.preventDefault(); this.sfx.unlock(); const p = this.toLogical(e);
      if (Math.hypot(p.x - 26, p.y - 22) < 20) { this.sfx.setMuted(!this.sfx.muted); return; }
      if (this.state !== 'play' || this.ending) return;
      const s = this.cardAt(p); if (s < 0) return;
      const id = this.hand.hand[s], cfg = CONFIG.cards[id];
      if (this.elixir < cfg.cost) { this.cardDeny[s] = 1; this.sfx.play('deny'); return; }
      this.drag = { slot: s, id, cfg, px: p.x, py: p.y, touch: e.pointerType === 'touch', tx: 9, ty: 20, inArena: false, valid: false };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      this.updateDrag();
    });
    cv.addEventListener('pointermove', e => { if (!this.drag) return; const p = this.toLogical(e); this.drag.px = p.x; this.drag.py = p.y; this.updateDrag(); });
    const end = e => {
      if (!this.drag) return; const p = this.toLogical(e); this.drag.px = p.x; this.drag.py = p.y; this.updateDrag();
      const d = this.drag; this.drag = null;
      if (e.type !== 'pointercancel' && d.inArena && d.valid && this.state === 'play' && !this.ending && this.elixir >= d.cfg.cost) {
        this.elixir -= d.cfg.cost; this.hand.use(d.slot); this.cardPop[d.slot] = 1;
        this.deploy(0, d.id, d.tx, d.ty);
      } else if (d.inArena && !d.valid && e.type !== 'pointercancel') this.sfx.play('deny');
    };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('contextmenu', e => e.preventDefault());
  }
  updateDrag() {
    const d = this.drag; if (!d) return;
    const T = CONFIG.T, py = d.py - (d.touch ? 46 : 0);
    d.tx = (d.px - CONFIG.AX) / T; d.ty = (py - CONFIG.AY) / T;
    d.inArena = d.tx >= 0 && d.tx <= 18 && d.ty >= 0 && d.ty <= 32 && d.py < CONFIG.AY + 32 * T + (d.touch ? 30 : 0);
    d.tx = clamp(d.tx, 0.6, 17.4); d.ty = clamp(d.ty, 0.6, 31.4);
    if (!d.inArena) { d.valid = false; return; }
    d.valid = d.cfg.type === 'spell' ? true : this.arena.canDeploy(this, 0, d.tx, d.ty);
  }

  loop(ts) {
    const dt = Math.min(0.05, (ts - this.last) / 1000); this.last = ts;
    this.update(dt); this.renderer.render();
    requestAnimationFrame(t => this.loop(t));
  }
}

/* ---------------- 부트스트랩 ---------------- */
const cv = document.getElementById('cv'), stage = document.getElementById('stage');
const game = new Game(cv);
function resize() {
  const s = Math.min(innerWidth / CONFIG.W, innerHeight / CONFIG.H), w = CONFIG.W * s, h = CONFIG.H * s, dpr = Math.min(window.devicePixelRatio || 1, 2);
  stage.style.width = w + 'px'; stage.style.height = h + 'px'; stage.style.fontSize = (16 * s) + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); game.scale = cv.width / CONFIG.W;
}
addEventListener('resize', resize); resize();
let selDiff = 'normal';
document.querySelectorAll('#diffRow button').forEach(b => b.addEventListener('click', () => {
  selDiff = b.dataset.d; document.querySelectorAll('#diffRow button').forEach(x => x.classList.toggle('sel', x === b));
}));
document.getElementById('startBtn').addEventListener('click', () => { game.sfx.unlock(); game.start(selDiff); });
document.getElementById('againBtn').addEventListener('click', () => { game.sfx.unlock(); game.start(selDiff); });
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('result').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); game.state = 'menu'; game.reset();
});

/* =====================================================================
   조작법
   - PC: 아래 카드를 마우스로 드래그해 내 진영(파랑, 강 아래쪽)에 놓으세요. 우상단/좌상단 스피커 버튼으로 음소거.
   - 모바일: 카드를 손가락으로 끌어다 놓으면 됩니다(손가락에 가리지 않게 미리보기가 약간 위에 표시됨).
   - 엘릭서가 부족한 카드는 흑백이며 보라색 진행바로 충전 정도를 보여줍니다.
   - 유닛은 내 진영에만, 주문은 어디든. 상대 프린세스타워를 부수면 그쪽 레인 앞쪽으로 배치 영역이 확장됩니다.
   - 경기 3분(마지막 1분 엘릭서 2배), 동점이면 1분 연장전(서든데스).

   카드 추가 방법
   1) CONFIG.cards 에 항목을 추가한다.
        유닛:  { name, cost, rarity, type:'unit', hp, dmg, hit, speed, range, r, mass, ds, sh,
                 proj:'bullet'|'ball'(원거리), projSpeed, bldOnly(건물만 공격), count(마릿수), jump, hop, kamikaze, death, pz/pcy }
        건물:  { type:'building', hp, dmg, hit, range, r, life, proj, projSpeed, ds, sh }
        주문:  { type:'spell', ... }  -> Spell 클래스에 동작 추가(id 별 분기)
   2) drawNewCard(c, o) 함수를 만든다. 발 중심 (0,0), 위쪽이 -y, 오른쪽을 보는 100유닛 크기로 그리고
      o.t(시간) o.walk(걷기 0~1) o.atk(공격 진행 0~1) o.col(진영색) 을 사용해 애니메이션한다.
   3) SPRITES 에 등록:  SPRITES.newcard = drawNewCard;
   4) CONFIG.deck 에 id 를 넣는다(8장). 필요하면 AIPlayer.defend/attack 에 사용 규칙을 추가한다.
   ===================================================================== */
</script>
